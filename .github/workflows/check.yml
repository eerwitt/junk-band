name: Check studio
on: [push, pull_request]
jobs:
  browser-and-gateway:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - run: npm ci --offline --cache .npm-cache --ignore-scripts --no-audit --no-fund
      - run: uv sync --extra dev
      - run: uv run python scripts/build_web.py
      - run: npm run check
      - run: npm run format:check
      - run: uv run ruff check services scripts
      - run: uv run ruff format --check services scripts
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run playwright install chromium
      - run: uv run python scripts/check_godot_browser.py --start-server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/godot-browser/
