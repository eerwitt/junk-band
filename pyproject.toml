[project]
name = "junk-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pillow>=11,<13", "numpy>=2,<3", "openai>=1.100,<3", "httpx>=0.28,<1",
  "meta-sam-parser>=0.1", "modal>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.20,<2", "playwright==1.64.1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "LOG"]
ignore = ["E501"]

[tool.mypy]
files = ["services/gateway", "scripts"]
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["services/tests"]
pythonpath = ["."]
