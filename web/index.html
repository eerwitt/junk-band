<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f5ec" />
    <meta
      name="description"
      content="A living sampler. Turn your found sounds into a dancing paper band."
    />
    <title>JUNK — The Living Sampler</title>
    <link rel="stylesheet" href="/shell.css" />
    <script src="/config.js"></script>
    <script type="importmap">
      { "imports": { "zod": "/vendor/zod/index.js" } }
    </script>
  </head>
  <body>
    <canvas
      id="canvas"
      tabindex="0"
      aria-label="JUNK living sampler. Use the accessible controls or keyboard shortcuts to play, import, edit and export."
      >Your browser needs WebGL 2 to run the stage.</canvas
    >
    <div id="loading">
      <strong>JUNK</strong>
      <p id="loading-status" role="status">Opening your little world…</p>
      <span>THE LIVING SAMPLER</span>
    </div>
    <nav
      id="accessible-controls"
      class="accessible"
      aria-label="Accessible sampler controls"
    ></nav>
    <p
      id="accessible-status"
      class="sr-only"
      role="status"
      aria-live="polite"
    ></p>
    <output id="debug" hidden></output>
    <script type="module" src="/modules/browser/main.js"></script>
  </body>
</html>
